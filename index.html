<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <nav>
    <ul>
        <li class="brand"><img src="logo.png" alt="musico">musico</li>
        <li>Home</li>
        <li>About</li>
    </ul>
   </nav> 
   <div class="container">
     <div class = "songList"></div>
     <h1>GP HEERA Saaiyan - (unplugged) song</h1>
     <div>
        <div class = "songItem">
            <img src="cover.jpg" alt="1">
            <span>Saaiyan</span>

        </div>
     </div>

   </div>
   <div class = "bottom">
    <input type="range" name="range" id="myProgressBar" min ="0" max="100">    
    <div class = "icons">
        <!-- frontawesome icons -->
         <i class="fa-solid fa-3x fa-backward"></i>
         <i class="fa-solid fa-3x fa-play"></i>

    </div> 
</div>
